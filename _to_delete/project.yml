# 工程配置文件（XcodeGen 读取它来生成 CoinFlip.xcodeproj）
# 修改这里之后，重新运行 ./scripts/setup.sh 即可生效。
# 不要只在 Xcode 界面里改设置——重新生成工程时会被这里的内容覆盖。

name: CoinFlip

options:
  bundleIdPrefix: com.coinflip
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 真机运行需要开发团队。在 Xcode 里查到你的 Team ID 后填在这里（去掉前面的 #）：
    # DEVELOPMENT_TEAM: ABCDE12345

targets:
  CoinFlip:
    type: application
    platform: iOS
    sources:
      - path: CoinFlip
        excludes:
          - "**/README.md"
    settings:
      base:
        # 如果真机运行提示 Bundle Identifier 已被占用，把下面改成独一无二的名字
        PRODUCT_BUNDLE_IDENTIFIER: com.coinflip.app.dev
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"                      # 仅 iPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 抛硬币
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait   # 仅竖屏
        INFOPLIST_KEY_UIStatusBarHidden: YES             # 启动时隐藏状态栏
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CoinFlipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoinFlipTests
    dependencies:
      - target: CoinFlip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.coinflip.app.dev.tests

schemes:
  CoinFlip:
    build:
      targets:
        CoinFlip: all
        CoinFlipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoinFlipTests
    archive:
      config: Release
